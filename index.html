  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-page: #0F0F12;
      --bg-card: #1A1A1F;
      --bg-stat: #232328;
      --border-soft: #2E2E36;
      --text-primary: #F5F5F5;
      --text-secondary: #A8A8B0;
      --text-muted: #888892;
      --text-faint: #5C5C66;

      /* Brand colors */
      --c-telegram: #229ED9;
      --c-instagram-1: #F58529;
      --c-instagram-2: #DD2A7B;
      --c-instagram-3: #8134AF;
      --c-facebook: #1877F2;
      --c-whatsapp: #25D366;
      --c-tiktok-bg: #010101;
      --c-tiktok-cyan: #25F4EE;
      --c-tiktok-pink: #FE2C55;

      --radius-btn: 14px;
      --radius-card: 20px;
    }

    html, body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* subtle radial glow background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(34, 158, 217, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(193, 53, 132, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 20px 24px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      display: block;
      margin: 0 auto;
      object-fit: cover;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease;
    }

    .logo:hover { transform: scale(1.04); }

    .tagline {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: 18px;
      line-height: 1.5;
      padding: 0 12px;
      font-weight: 400;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }

    .stat {
      background: var(--bg-stat);
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
      border: 1px solid var(--border-soft);
    }

    .stat-num {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* LINKS */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: var(--radius-btn);
      text-decoration: none;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 500;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      min-height: 56px;
      position: relative;
      overflow: hidden;
    }

    .link:active {
      transform: scale(0.98);
    }

    .link:hover {
      filter: brightness(1.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .link-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .link-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .link-label {
      flex: 1;
      text-align: left;
    }

    .link-arrow {
      width: 18px;
      height: 18px;
      opacity: 0.7;
      flex-shrink: 0;
    }

    /* Brand backgrounds */
    .link-telegram  { background: var(--c-telegram); }
    .link-instagram { background: linear-gradient(135deg, var(--c-instagram-1) 0%, var(--c-instagram-2) 50%, var(--c-instagram-3) 100%); }
    .link-facebook  { background: var(--c-facebook); }
    .link-whatsapp  { background: var(--c-whatsapp); }
    .link-tiktok    { background: var(--c-tiktok-bg); border: 1px solid var(--border-soft); }

    /* FOOTER */
    .footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border-soft);
    }

    .footer p {
      font-size: 12px;
      color: var(--text-faint);
      line-height: 1.6;
    }

    .footer-domain {
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 4px;
    }

    /* In-app browser warning (Instagram/TikTok/FB internal) */
    .browser-warning {
      display: none;
      background: rgba(255, 200, 0, 0.08);
      border: 1px solid rgba(255, 200, 0, 0.2);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: #FFD37A;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    /* Small phones */
    @media (max-width: 360px) {
      .page { padding: 24px 16px 20px; }
      .logo { width: 110px; height: 110px; }
      .link { font-size: 15px; padding: 14px 16px; }
      .stat-num { font-size: 18px; }
    }

    /* Tablet / desktop — keep mobile feel but breathe */
    @media (min-width: 540px) {
      .page { padding: 48px 24px 32px; }
      .logo { width: 150px; height: 150px; }
      .tagline { font-size: 16px; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>

    (function() {

      var inAppPatterns = ['Instagram', 'FBAN', 'FBAV', 'TikTok', 'BytedanceWebview', 'Line/'];
      var isInApp = inAppPatterns.some(function(p) { return ua.indexOf(p) > -1; });

        if (warn) warn.style.display = 'block';
      }
    })();
